
name: RAG Chatbot CI

on:
  push:
    paths:
      - "rag-chatbot/**"
      - ".github/workflows/rag-chatbot-ci.yml"
  pull_request:
    paths:
      - "rag-chatbot/**"
      - ".github/workflows/rag-chatbot-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: rag-chatbot

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: rag-chatbot/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run automated tests
        run: python -m pytest tests/ -v
